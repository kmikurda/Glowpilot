; PlatformIO Project Configuration — Glowpilot firmware
; Target: Seeed XIAO ESP32-C3
; USB CDC serial at 115200 baud
; Note: XIAO ESP32-C3 uses the hardware JTAG/Serial USB controller (VID=0x303A
; PID=0x1001) whose identifiers are fixed in silicon and cannot be changed by
; firmware. The service locates the device by these fixed identifiers.

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600
