; PlatformIO Project Configuration — Glowpilot firmware
; Target: Seeed XIAO ESP32-C3
; USB CDC serial at 115200 baud; device identified by VID/PID

[env:xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
lib_deps =
    fastled/FastLED @ ^3.6.0
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -D USB_VID=0x2886
    -D USB_PID=0x0045
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_speed = 115200
upload_speed = 921600
